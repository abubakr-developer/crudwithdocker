version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: docker-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: admin123
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: crud2
      MYSQL_USER: appuser
      MYSQL_PASSWORD: app123
    ports:
      - '3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-padmin123"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    image: YOUR_DOCKERHUB_USERNAME/docker-backend:latest
    container_name: docker-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: appuser
      DB_PASSWORD: app123
      DB_NAME: crud2
    ports:
      - '3000:3000'

  frontend:
    image: YOUR_DOCKERHUB_USERNAME/docker-frontend:latest
    container_name: docker-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '5173:80'

volumes:
  mysql_data: