name: Deploy Docker App (Secured)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------
  # 1. SECRET SCANNING — block if any credentials/keys are exposed
  # ---------------------------------------------------------------
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so Gitleaks can scan past commits

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------
  # 2. DEPENDENCY / SAST SCANNING — frontend + backend
  # ---------------------------------------------------------------
  code-scan:
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend deps
        working-directory: ./backend
        run: npm ci

      - name: Install frontend deps
        working-directory: ./frontend
        run: npm ci

      - name: npm audit (backend)
        working-directory: ./backend
        run: npm audit --audit-level=high

      - name: npm audit (frontend)
        working-directory: ./frontend
        run: npm audit --audit-level=high

      - name: Semgrep SAST scan
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/javascript
            p/nodejs
            p/owasp-top-ten
            p/secrets

  # ---------------------------------------------------------------
  # 3. UNIT TESTS — backend (Jest + Supertest, 2 tests)
  # ---------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    needs: code-scan
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend deps
        working-directory: ./backend
        run: npm ci

      - name: Run backend tests
        working-directory: ./backend
        run: npm test

  # ---------------------------------------------------------------
  # 4. BUILD IMAGES (no push yet) + IMAGE VULNERABILITY SCAN
  # ---------------------------------------------------------------
  image-scan:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (local only)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: docker-backend:scan

      - name: Build frontend image (local only)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: docker-frontend:scan

      - name: Trivy scan — backend image
        uses: aquasecurity/trivy-action@v0.29.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: docker-backend:scan
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'          # report findings without failing the build
          ignore-unfixed: true

      - name: Trivy scan — frontend image
        uses: aquasecurity/trivy-action@v0.29.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: docker-frontend:scan
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true

      - name: Trivy scan — filesystem / IaC (Dockerfiles, compose)
        uses: aquasecurity/trivy-action@v0.29.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '0'   # informational for now; flip to '1' once clean

  # ---------------------------------------------------------------
  # 5. BUILD + PUSH + DEPLOY — only runs if all scans/tests passed
  # ---------------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: [secret-scan, code-scan, test, image-scan]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/docker-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/docker-frontend:latest

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd ~/crudwithdocker
            git pull origin main
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose ps
